[project]
name = "rabbit-hole"
version = "0.1.0"
description = "The Random Rabbit Hole - weekly science paper to NotebookLM audio pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "feedparser>=6.0",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "mutagen>=1.47",
    "plexapi>=4.15",
    "structlog>=24.1",
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rabbit_hole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
